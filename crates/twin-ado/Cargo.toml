[package]
name = "twin-ado"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "twin_ado"

[[bin]]
name = "twin-ado"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
ureq = { version = "3.5.2", features = ["json"] }
